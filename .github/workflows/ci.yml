name: CI

on:
  push:
  pull_request:

# The Electron binary is ~100MB and CI never launches the app: it only
# typechecks, runs the engine tests and bundles with esbuild.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
